    chest_abdomen: 317
    leg_knee_foot: 247

not_supported_by_this_data:
  - Injury rates per worker or per hour (establishments with no cases are absent from the case file)
  - Interpretation of differences between states (violence share ranges 5.1% to 13.2% among the 15 largest states)

limitations:
  - Case detail submission applies only to establishments with 100 or more employees in designated industries.
  - Narratives are employer-written free text; detail and wording vary.
  - Violence is a keyword classification, not an OSHA field, in the 2025 file.
  - No establishment is named. A recorded injury does not establish fault.

