problem: Violence against nursing-facility caregivers
scope: US nursing care facilities (NAICS 6231)
description: >-
  Work-related injuries caused by a resident, patient, visitor, or other
  person hitting, kicking, biting, scratching, grabbing, or otherwise acting
  aggressively toward the employee. OSHA's 2025 case detail file does not code
  injuries by cause; violence is identified from the employer-written narrative.

signals:
  osha_records:
    - id: ITA_CASE_DETAIL
      title: Injury Tracking Application case detail data
      publisher: OSHA
      unit: one row per recordable case (OSHA Form 300A/301)
      task_coded_by_publisher: false
      note: >-
        OSHA has added OIICS event codes to the 2023 and 2024 case detail
        files. OIICS division 1 (violence and other injuries by persons or
        animals) is the official counterpart of this classification.

classification:
  rule: >-
    A named person followed within a few words by a hostile act; or the act
    described as done by such a person; or combative or aggressive behavior
    together with a hostile act; or an assault by a co-worker. Contact where
    the employee struck an object is excluded unless aggression is described.
    Resistance during care (pulling back, pushing back) alone is not violence.
  rule_file: resident-violence/derived/classification-rule.txt
  validation:
    sample: 500 nursing-facility cases with silver-standard labels
    labels_file: benchmark/benchmark-500-ai-prelabeled.csv
    precision: 0.961
    recall: 0.875
    status: development score; rule was written against the same sample

distribution_2025:
  source: ITA Case Detail Data, 2025, submissions through 2026-03-15
  cases_naics_6231: 24292
  violence_cases: 2159
  violence_share: 0.089
  during_handling_task: 345
  nursing_assistant_share: 0.754
  days_away_sum: 15435
  days_restricted_sum: 21199
  cases_zero_days_away: 1475
  cases_over_90_days_away: 56
  longest_absence_days: 312
  mechanism_named:
    hit_punch_strike: 955
    grab_twist_pinch: 482
    bite: 316
    kick: 263
    scratch: 187
    push_shove: 125
    spit: 31
  body_region_named:
    head_face_eye: 646
    hand_finger_wrist: 605
    arm_shoulder: 560
    back_neck: 391
    chest_abdomen: 296
    leg_knee_foot: 239

not_supported_by_this_data:
  - Injury rates per worker or per hour (establishments with no cases are absent from the case file)
  - Interpretation of differences between states (violence share ranges 4.7% to 13.5% among the 15 largest states)

limitations:
  - Case detail submission applies only to establishments with 100 or more employees in designated industries.
  - Narratives are employer-written free text; detail and wording vary.
  - Violence is a keyword classification, not an OSHA field, in the 2025 file.
  - No establishment is named. A recorded injury does not establish fault.

