problem: Violence against nursing-facility caregivers
scope: US nursing care facilities (NAICS 6231)
description: >-
  Work-related injuries caused by a resident, patient, visitor, or other
  person hitting, kicking, biting, scratching, grabbing, or otherwise acting
  aggressively toward the employee. OSHA's 2025 case detail file does not code
  injuries by cause; violence is identified from the employer-written narrative.

signals:
  osha_records:
    - id: ITA_CASE_DETAIL
      title: Injury Tracking Application case detail data
      publisher: OSHA
      unit: one row per recordable case (OSHA Form 300/301)
      task_coded_by_publisher: false
      note: >-
        OSHA has added OIICS codes to the 2023 and 2024 case detail files,
        generated with BLS's automated coder. Event code 11, "Violent acts by
        other person", is the official counterpart of this classification.

classification:
  rule: >-
    A named person followed within a few words by a hostile act; or the act
    described as done by such a person; or combative or aggressive behavior
    together with a hostile act; or an assault by a co-worker. Contact where
    the employee struck an object is excluded unless aggression is described.
    Resistance during care (pulling back, pushing back) alone is not violence.
  rule_file: resident-violence/derived/classification-rule.txt
  validation:
    sample: >-
      500 nursing-facility cases labeled by an AI language model (silver
      standard, not human-reviewed)
    labels_file: benchmark/benchmark-500-ai-prelabeled.csv
    precision: 0.961
    recall: 0.875
    status: development score; rule was written against the same sample
  out_of_sample:
    reference: OSHA OIICS event code 11
    data: ITA Case Detail Data, 2024, NAICS 6231
    cases: 28074
    precision: 0.810
    recall: 0.779
    kappa: 0.776
    share_rule: 0.078
    share_oiics: 0.082
    details: validation-oiics/

distribution_2025:
  source: ITA Case Detail Data, 2025, submissions through 2026-08-31
  cases_naics_6231: 25860
  violence_cases: 2291
  violence_share: 0.089
  during_handling_task: 365
  nursing_assistant_share: 0.749
  days_away_sum: 17133
  days_restricted_sum: 22596
  cases_zero_days_away: 1561
  cases_over_90_days_away: 62
  longest_absence_days: 347
  mechanism_named:
    hit_punch_strike: 1009
    grab_twist_pinch: 520
    bite: 336
    kick: 278
    scratch: 200
    push_shove: 131
    spit: 31
  body_region_named:
