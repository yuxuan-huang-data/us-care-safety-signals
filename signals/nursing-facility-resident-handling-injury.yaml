problem: Resident-handling injury among nursing-facility caregivers
scope: US nursing care facilities (NAICS 6231)
description: >-
  Work-related injuries sustained while a caregiver lifts, transfers,
  repositions, boosts, or turns a resident. OSHA's 2025 case detail file does
  not code injuries by task; handling is identified from the employer-written
  narrative.

signals:
  osha_records:
    - id: ITA_CASE_DETAIL
      title: Injury Tracking Application case detail data
      publisher: OSHA
      unit: one row per recordable case (OSHA Form 300/301)
      fields_used:
        - naics_code
        - job_description
        - SOC_description
        - incident_outcome
        - dafw_num_away
        - djtr_num_tr
        - time_started_work
        - time_of_incident
        - New_nar_before_incident
        - New_nar_what_happened
        - New_nar_injury_illness
        - New_nar_object_substance
      task_coded_by_publisher: false
      note: >-
        OSHA has added OIICS codes to the 2023 and 2024 case detail files,
        generated with BLS's automated coder. Event code 71 with a person as
        the source is the official counterpart of this classification.

classification:
  rule: >-
    Narrative names a person being cared for (resident, patient) and a
    movement of that person (transfer, lift, reposition, boost, turn, roll,
    pivot, mechanical lift, gait belt, sit-to-stand, slide or draw sheet,
    and related terms), or uses a phrase such as "patient handling".
  rule_file: nursing-facility-handling/derived/classification-rule.txt
  validation:
    sample: >-
      200 nursing-facility cases, drawn at random and blind to the rule,
      labeled by an AI language model under a written standard (silver
      standard, not human-reviewed)
    labels_file: nursing-facility-handling/derived/validation-labeled.csv
    strict_rule: {precision: 0.846, recall: 0.717}
    broad_rule: {precision: 0.698, recall: 0.804}
    labeled_share_handling: {value: 0.230, ci95: [0.177, 0.293]}
  human_blind_review:
    reviewer: author, blind to AI labels and rule predictions
    cases: 200
    agreement_with_ai: {handling_vs_not: 0.915, kappa: 0.758, three_category: 0.780, kappa_three_category: 0.658}
    strict_rule_vs_human: {precision: 0.846, recall: 0.733}
    broad_rule_vs_human: {precision: 0.698, recall: 0.822}
    human_share_handling: {value: 0.225, ci95: [0.173, 0.288]}
    labels_file: nursing-facility-handling/derived/validation-labeled.csv (column human_label)
  out_of_sample:
    reference: OSHA OIICS event code 71, source a person
    data: ITA Case Detail Data, 2024, NAICS 6231
    cases: 28074
    precision: 0.695
    recall: 0.676
    kappa: 0.614
    share_rule: 0.182
    share_oiics: 0.187
    details: validation-oiics/

distribution_2025:
  source: ITA Case Detail Data, 2025, submissions through 2026-08-31
  cases_all_industries: 782582
  cases_naics_6231: 25860
  handling_cases_strict: 5654
  handling_share_strict: 0.219
  handling_cases_broad: 7622
  nursing_assistant_share: 0.803
  days_away_sum: 58178
  days_restricted_sum: 125621
  restricted_to_away_ratio: 2.16
  cases_zero_days_away: 3598
  cases_over_90_days_away: 215
  longest_absence_days: 348
  back_or_lumbar_named: 2071

did_not_hold:
  - hypothesis: Handling injuries accumulate as a shift goes on
    result: >-
      Share of handling cases by hour into the shift is 5.9% in the first
      hour and 10.6% to 12.6% in hours two through six, then falls as shifts
      end. This is a share of cases, not a rate per worker on duty. No claim
      is made.
  - hypothesis: Night-shift handling injuries are more severe
    result: >-
      Mean days away 32.3 (night, 304 cases) vs 27.5 (day, 1,525 cases);
      medians 8.0 vs 6.0. Small difference, small night sample. No claim made.
  - hypothesis: Facilities with higher pressure-ulcer rates have higher injury rates
    result: >-
      Pearson r = 0.004, Spearman rho = 0.018 (DART rate vs CMS long-stay
      pressure-ulcer rate, n = 7,556 facilities linked via crosswalk/, tiers
      A and B; OSHA release through 2026-08-31, CMS files dated 2026-10-01).
      Earlier releases gave r = -0.001 (n = 7,370).

limitations:
  - ITA submission applies only to establishments above OSHA size and industry thresholds.
  - Narratives are employer-written free text; detail and wording vary.
  - Handling is a keyword classification, not an OSHA field, in the 2025 file.
  - Open cases undercount final days away.
  - No establishment is named. A recorded injury does not establish fault.

