problem: Hospital-acquired pressure injury
scope: US acute care hospitals
description: >-
  Stage III/IV or unstageable pressure ulcers recorded as a secondary
  diagnosis and not present on admission. Distinguished from prevalence
  measures by the present-on-admission exclusion.

signals:
  cms_measures:
    - id: PSI_03
      title: Pressure ulcer rate
      dataset: Complications and Deaths - Hospital
      unit: per 1,000 discharges
      risk_adjusted: true
      cms_provides_comparison: true
      comparison_field: Compared to National
      definition_source: >-
        AHRQ Quality Indicators, Patient Safety Indicator 03,
        ICD-10-CM/PCS specification

    - id: PSI_08
      title: In-hospital fall-associated fracture rate
      dataset: Complications and Deaths - Hospital
      relevance: >-
        Falls during repositioning or transfer are one contributing
        pathway; the measure does not identify mechanism.

    - id: PSI_90
      title: Patient safety and adverse events composite
      contains: [PSI_03, PSI_06, PSI_08, PSI_09, PSI_10, PSI_11, PSI_12, PSI_13, PSI_14, PSI_15]

    - id: COMP_HIP_KNEE
      title: Rate of complications for hip/knee replacement patients
      relevance: orthopedic service line volume and outcome proxy

financial_consequence:
  program: Hospital-Acquired Condition Reduction Program
  authority: Affordable Care Act
  mechanism: >-
    Hospitals in the worst-performing quartile by Total HAC Score receive a
    1% reduction applied to all Medicare inpatient payments, not to a single
    service line.
  component_measures:
    - CMS PSI 90 composite
    - CLABSI
    - CAUTI
    - SSI (colon and abdominal hysterectomy)
    - MRSA bacteremia
    - C. difficile infection
  fy2026:
    hospitals_scored: 3055
    hospitals_penalized: 719
    measurement_period_psi90: 2022-07-01 to 2024-06-30
    measurement_period_hai: 2023-01-01 to 2024-12-31

distribution_2026:
  source: CMS Complications and Deaths - Hospital, released 2026-09-10
  hospitals_with_psi03: 3056
  psi03_median: 0.51
  psi03_p90: 1.11
  psi03_max: 8.31
  rated_worse_than_national: 178
  rated_better_than_national: 49
  rated_no_different: 2829
  rated_not_available: 1692
  rated_cases_too_small: 42
  psi08_median: 0.27
  psi08_p90: 0.32

cross_section:
  penalized_and_rated_worse_psi03: 95
  penalized_and_rated_no_different: 602
  penalized_and_rated_better: 2

limitations:
  - >-
    PSI-03 is claims-derived, not chart-abstracted. Coding practice affects
    the rate; published research documents spinal cord injury cases not coded
    for paralysis flagging as events.
  - >-
    Pressure injury has multiple contributing causes including nutrition,
    repositioning frequency, support surface, perfusion, immobility duration,
    and mechanical forces during repositioning and transfer. This mapping
    identifies where the outcome is measured, not what causes it.
  - >-
    HACRP measurement periods and Complications file reporting periods differ.
    Penalty status and PSI-03 rate are not measured over identical windows.
  - >-
    The Compared to National determination is CMS's, based on risk-adjusted
    confidence intervals. It is not calculated in this analysis.
  - Hospitals are identified by CMS Certification Number and state only.

retrieved: 2026-10-29
